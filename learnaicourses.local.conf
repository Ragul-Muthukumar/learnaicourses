# Learn AI Courses Apache vhost
# Enable with:
#   sudo cp learnaicourses.local.conf /etc/apache2/sites-available/
#   sudo a2ensite learnaicourses.local.conf
#   sudo systemctl reload apache2
# Then add "127.0.0.1 learnaicourses.local" to /etc/hosts
# and set WP home/siteurl to http://learnaicourses.local
#
# Note: the existing steorra.local catch-all alias (*) currently intercepts
# Host: localhost and returns 503, so use this named vhost or the PHP server.

<VirtualHost *:80>
    ServerName learnaicourses.local
    DocumentRoot /var/www/html/wp-sites/learnaicourses

    <Directory /var/www/html/wp-sites/learnaicourses>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/learnaicourses_error.log
    CustomLog ${APACHE_LOG_DIR}/learnaicourses_access.log combined
</VirtualHost>
